<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link rel="shortcut icon" type="image/png" href="{{ '/assets/img/logo.png' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div id="particles-js" aria-hidden="true"></div>

    <nav class="navbar" aria-label="Navegación principal">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="nav-brand-stack">
    <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Logo PsiNet" class="brand-img">
    <span class="brand-text">AGO'D</span>
</a>
            <div class="nav-links">
                <a href="{{ '/' | relative_url }}" data-i18n="nav_about">About</a>
                <a href="{{ '/experience' | relative_url }}" data-i18n="nav_exp">Experience</a>
                <a href="{{ '/papers' | relative_url }}" data-i18n="nav_papers">Papers</a>
                <a href="{{ '/projects' | relative_url }}" data-i18n="nav_projects">Projects</a>
                <a href="{{ '/software' | relative_url }}" data-i18n="nav_soft">Software</a>
                <a href="{{ '/talks' | relative_url }}" data-i18n="nav_talks">Talks</a>
                <a href="{{ '/blog' | relative_url }}" data-i18n="nav_blog">Blog</a>
                <a href="{{ '/contact' | relative_url }}" data-i18n="nav_contact">Contact</a>
                
                <div class="lang-switcher" role="group" aria-label="Selector de idioma">
                    <button type="button" class="lang-btn" data-lang="es" aria-label="Cambiar idioma a español">ES</button>
                    <button type="button" class="lang-btn" data-lang="en" aria-label="Change language to English">EN</button>
                    <button type="button" class="lang-btn" data-lang="pt" aria-label="Mudar idioma para português">PT(BR)</button>
                    <button type="button" class="lang-btn" data-lang="ja" aria-label="言語を日本語に変更">JA</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="main-content" tabindex="-1">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="footer">
        <p data-i18n="footer_text">© 2026 Angel García O'Diana | Data Science & Psychology</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="{{ '/assets/js/legacy-support.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/background.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/translations.js' | relative_url }}"></script>

</body>
</html>
